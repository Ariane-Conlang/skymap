<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Starmap Generator</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; }
        canvas { background: #000; margin: 1em; border: 1px solid #555; }
        table { margin: auto; background: #222; color: #fff; border-collapse: collapse; }
        td, th { padding: 0.3em; border: 1px solid #555; }
        input { background: #333; color: #fff; border: none; width: 5em; }
    </style>
</head>
<body>
    <h1>Starmap Generator</h1>
    <div>
        <canvas id="canvasNorth"></canvas>
        <canvas id="canvasSouth"></canvas>
    </div>
    <button id="updateButton">Update Star Map</button>
    <button id="exportNorth">Download North Hemisphere</button>
    <button id="exportSouth">Download South Hemisphere</button>

    <h2>Star Data</h2>
    <button id="updateButton">Update Star Map</button>
    <table>
        <tr><th>ID</th><th>Class</th><th>Magnitude</th><th>Distance</th></tr>
        <tbody id="starTable"></tbody>
    </table>
    <script src="script.js"></script>
    
</body>
</html>
